name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    name: PowerShell syntax check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $failed = $false
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File

          foreach ($file in $files) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$parseErrors)

            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $first = $parseErrors[0]
              Write-Host "::error file=$($file.FullName),line=$($first.Extent.StartLineNumber)::$($first.Message)"
              $failed = $true
            }
            else {
              Write-Host "OK   $($file.Name)"
            }
          }

          Write-Host ""
          Write-Host "Parsed $($files.Count) script(s)."
          if ($failed) { exit 1 }

      - name: Updater tests (offline simulation)
        shell: powershell
        run: .\Test-Updater.ps1

      - name: Updater tests against the real GitHub releases
        shell: powershell
        run: .\Test-Updater.ps1 -Live

      - name: Ensure generated files are not committed
        shell: powershell
        run: |
          $bad = @('ProtonPortSync.vbs', 'config.json')
          foreach ($name in $bad) {
            if (Test-Path -LiteralPath $name) {
              Write-Host "::error::$name is generated locally and must not be committed"
              exit 1
            }
          }
          Write-Host "No generated files present."

  macos:
    name: macOS script tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit and mock end-to-end tests
        working-directory: macos
        run: python3 -m unittest discover -s tests -v

      - name: Generated LaunchAgent plist is valid
        run: |
          python3 macos/protonportsync.py print-plist > /tmp/test.plist
          plutil -lint /tmp/test.plist

      - name: CLI smoke test
        run: python3 macos/protonportsync.py version

  linux:
    name: Linux script tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit and mock end-to-end tests
        working-directory: linux
        run: python3 -m unittest discover -s tests -v

      - name: Generated systemd unit is valid
        run: |
          python3 linux/protonportsync.py print-unit > /tmp/test.service
          cat /tmp/test.service
          grep -q '^ExecStart=' /tmp/test.service
          grep -q '^WantedBy=default.target' /tmp/test.service

      - name: CLI smoke test
        run: python3 linux/protonportsync.py version
